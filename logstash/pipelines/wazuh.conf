# Wazuh alerts (alerts.json) -> ECS -> Elasticsearch (security-wazuh-*)
input {
  kafka {
    bootstrap_servers => "${KAFKA_BROKER:kafka:9092}"
    topics => ["wazuh-events"]
    group_id => "logstash-wazuh"
    codec => json
    auto_offset_reset => "latest"
  }
}

filter {
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }

  mutate {
    rename => {
      "[rule][description]" => "[rule][name]"
      "[agent][name]"       => "[host][name]"
      "[agent][ip]"         => "[host][ip]"
      "[data][srcip]"       => "[source][ip]"
      "[data][srcuser]"     => "[user][name]"
      "[data][dstuser]"     => "[user][target][name]"
    }
    add_field => {
      "[event][module]"  => "wazuh"
      "[event][kind]"    => "alert"
      "[event][dataset]" => "wazuh.alerts"
    }
  }

  # Map Wazuh rule.level (0-15) to ECS event.severity
  if [rule][level] {
    mutate { copy => { "[rule][level]" => "[event][severity]" } }
  }

  # Tag for downstream SOAR routing
  if [rule][groups] {
    if "authentication_failed" in [rule][groups] { mutate { add_tag => ["bruteforce_candidate"] } }
    if "rootcheck" in [rule][groups] or "malware" in [rule][groups] { mutate { add_tag => ["malware_candidate"] } }
  }

  mutate { remove_field => ["@version"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:changeme_elastic}"
    index => "security-wazuh-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "security-wazuh"
    ilm_policy => "sybsec-ilm"
  }
}

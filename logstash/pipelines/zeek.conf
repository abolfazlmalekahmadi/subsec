# Zeek JSON logs (conn/dns/ssl/http/files) -> ECS -> Elasticsearch
input {
  kafka {
    bootstrap_servers => "${KAFKA_BROKER:kafka:9092}"
    topics => ["zeek-logs"]
    group_id => "logstash-zeek"
    codec => json
    auto_offset_reset => "latest"
    decorate_events => true
  }
}

filter {
  # Zeek ts is epoch seconds (float)
  date { match => ["ts", "UNIX"] target => "@timestamp" }

  # Identify the Zeek log type from the Kafka/Filebeat path or @stream
  if ![event][dataset] {
    mutate { add_field => { "[event][dataset]" => "zeek.%{[log][file][path]}" } }
  }

  mutate {
    rename => {
      "id.orig_h"  => "[source][ip]"
      "id.orig_p"  => "[source][port]"
      "id.resp_h"  => "[destination][ip]"
      "id.resp_p"  => "[destination][port]"
      "proto"      => "[network][transport]"
      "service"    => "[network][protocol]"
      "orig_bytes" => "[source][bytes]"
      "resp_bytes" => "[destination][bytes]"
      "duration"   => "[event][duration]"
      "uid"        => "[zeek][uid]"
    }
    add_field => {
      "[event][module]"  => "zeek"
      "[event][kind]"    => "event"
      "[observer][type]" => "network-sensor"
    }
  }

  # conn.log byte accounting for the ML feature pipeline
  if [source][bytes] and [destination][bytes] {
    ruby {
      code => "event.set('[network][bytes]', event.get('[source][bytes]').to_i + event.get('[destination][bytes]').to_i)"
    }
  }

  geoip { source => "[destination][ip]" target => "[destination][geo]" }
  mutate { remove_field => ["@version", "agent", "host"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:changeme_elastic}"
    index => "security-zeek-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "security-zeek"
    ilm_policy => "sybsec-ilm"
  }
}

# Suricata EVE JSON -> ECS -> Elasticsearch (security-suricata-*)
input {
  kafka {
    bootstrap_servers => "${KAFKA_BROKER:kafka:9092}"
    topics => ["suricata-alerts"]
    group_id => "logstash-suricata"
    codec => json
    auto_offset_reset => "latest"
    decorate_events => true
  }
}

filter {
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }

  # ECS network mapping
  mutate {
    rename => {
      "src_ip"    => "[source][ip]"
      "src_port"  => "[source][port]"
      "dest_ip"   => "[destination][ip]"
      "dest_port" => "[destination][port]"
      "proto"     => "[network][transport]"
      "app_proto" => "[network][protocol]"
      "flow_id"   => "[network][community_id]"
    }
    add_field => {
      "[event][module]"  => "suricata"
      "[event][dataset]" => "suricata.eve"
      "[observer][type]" => "ids"
    }
  }

  if [event_type] == "alert" {
    mutate {
      rename => {
        "[alert][signature]"    => "[rule][name]"
        "[alert][signature_id]" => "[rule][id]"
        "[alert][category]"     => "[rule][category]"
        "[alert][severity]"     => "[event][severity]"
      }
      add_field => { "[event][kind]" => "alert" }
    }
    # GeoIP enrichment on external source
    geoip { source => "[source][ip]" target => "[source][geo]" }
  }

  mutate { remove_field => ["host", "@version", "agent"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:changeme_elastic}"
    index => "security-suricata-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "security-suricata"
    ilm_policy => "sybsec-ilm"
  }
}

# Windows Sysmon events (via Winlogbeat/Filebeat) -> ECS -> Elasticsearch
input {
  kafka {
    bootstrap_servers => "${KAFKA_BROKER:kafka:9092}"
    topics => ["sysmon-events"]
    group_id => "logstash-sysmon"
    codec => json
    auto_offset_reset => "latest"
  }
}

filter {
  date { match => ["[winlog][event_data][UtcTime]", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"] target => "@timestamp" }

  mutate {
    add_field => {
      "[event][module]"  => "sysmon"
      "[event][dataset]" => "windows.sysmon_operational"
      "[event][kind]"    => "event"
    }
  }

  # Sysmon Event ID -> ECS event.category/action
  translate {
    source => "[winlog][event_id]"
    target => "[event][action]"
    dictionary => {
      "1"  => "process-creation"
      "3"  => "network-connection"
      "7"  => "image-loaded"
      "8"  => "create-remote-thread"
      "11" => "file-creation"
      "13" => "registry-value-set"
      "22" => "dns-query"
    }
    fallback => "other"
  }

  if [winlog][event_id] == 1 {
    mutate {
      rename => {
        "[winlog][event_data][Image]"        => "[process][executable]"
        "[winlog][event_data][CommandLine]"  => "[process][command_line]"
        "[winlog][event_data][ParentImage]"  => "[process][parent][executable]"
        "[winlog][event_data][Hashes]"       => "[process][hash][raw]"
        "[winlog][event_data][User]"         => "[user][name]"
      }
      add_field => { "[event][category]" => "process" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:changeme_elastic}"
    index => "security-sysmon-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "security-sysmon"
    ilm_policy => "sybsec-ilm"
  }
}

# TheHive 5 configuration (dev). Secrets here are demo defaults — change for prod.

# --- Database: JanusGraph on Cassandra ---
db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql {
      cluster-name = thehive
      keyspace = thehive
    }
  }
  index.search {
    backend = elasticsearch
    hostname = ["elasticsearch"]
    index-name = thehive
  }
}

# --- Attachment storage: local filesystem ---
storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/files
}

# --- Play secret (demo) ---
play.http.secret.key = "sybsec-thehive-demo-secret-change-me"

# --- Cortex connector: enables auto-running analyzers on observables ---
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule
cortex {
  servers = [
    {
      name = "sybsec-cortex"
      url = "http://cortex:9001"
      auth { type = "bearer", key = "${?CORTEX_API_KEY}" }
      # After first Cortex setup, set CORTEX_API_KEY env or edit this key.
    }
  ]
  refreshDelay = 1 minute
  maxRetryOnError = 3
}

# --- Misc ---
play.http.parser.maxDiskBuffer = 50MB
play.http.parser.maxMemoryBuffer = 10MB

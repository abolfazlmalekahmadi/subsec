[project]
name = "sybsec-anomaly-service"
version = "0.1.0"
description = "PyOD + ADTK anomaly detection microservice for the sybsec SOC"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "models/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "consumers/kafka_consumer.py", "main.py"]
